# Test workload: kept at 0 replicas between tests (P7)
apiVersion: apps/v1
kind: Deployment
metadata: {name: gate-test}
spec:
  replicas: 0
  selector:
    matchLabels: {app: gate-test}
  template:
    metadata:
      labels: {app: gate-test}
    spec:
      containers:
      - name: c
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command: ["sleep", "3600"]
