# What the app team declares; the contract check compares it with infra's infra-identity.
# releaseId is set per lane (release.yaml); the gate compares it with gate-state (ADR-08)
apiVersion: v1
kind: ConfigMap
metadata: {name: app-identity}
data:
  app: gate-test
  eaId: EA-9999
  customBlockVersion: v2
  gateRef: gate-v2     # the gate version this app declares; equals the ?ref= of the lane remote base (step 1.10)
