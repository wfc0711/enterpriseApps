# Copies both repos' declared values, the app name and the release ID into the gate Job's environment
# (cross-repo render, Phase 1 steps 1.5 and 1.9). Env names are anchored (^...$): Kustomize treats the value in
# [name=...] as an unanchored pattern, so [name=APP] would also hit APP_EA_ID and APP_CUSTOM_BLOCK_VERSION
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
- source: {kind: ConfigMap, name: app-identity, fieldPath: data.eaId}
  targets:
  - select: {kind: Job, name: gate}
    fieldPaths: ["spec.template.spec.containers.[name=^gate$].env.[name=^APP_EA_ID$].value"]
- source: {kind: ConfigMap, name: app-identity, fieldPath: data.customBlockVersion}
  targets:
  - select: {kind: Job, name: gate}
    fieldPaths: ["spec.template.spec.containers.[name=^gate$].env.[name=^APP_CUSTOM_BLOCK_VERSION$].value"]
- source: {kind: ConfigMap, name: infra-identity, fieldPath: data.eaId}
  targets:
  - select: {kind: Job, name: gate}
    fieldPaths: ["spec.template.spec.containers.[name=^gate$].env.[name=^INFRA_EA_ID$].value"]
- source: {kind: ConfigMap, name: infra-identity, fieldPath: data.customBlockVersion}
  targets:
  - select: {kind: Job, name: gate}
    fieldPaths: ["spec.template.spec.containers.[name=^gate$].env.[name=^INFRA_CUSTOM_BLOCK_VERSION$].value"]
- source: {kind: ConfigMap, name: app-identity, fieldPath: data.app}
  targets:
  - select: {kind: Job, name: gate}
    fieldPaths: ["spec.template.spec.containers.[name=^gate$].env.[name=^APP$].value"]
- source: {kind: ConfigMap, name: app-identity, fieldPath: data.releaseId}
  targets:
  - select: {kind: Job, name: gate}
    fieldPaths: ["spec.template.spec.containers.[name=^gate$].env.[name=^RELEASE_ID$].value"]
