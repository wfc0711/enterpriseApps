# Gate settings of this lane (plan P8, P12): activeDeadlineSeconds = GATE_TIMEOUT_SECONDS + 120
apiVersion: batch/v1
kind: Job
metadata: {name: gate}
spec:
  activeDeadlineSeconds: 420
  template:
    spec:
      containers:
      - name: gate
        env:
        - {name: LANE, value: prod}
        - {name: GATE_TIMEOUT_SECONDS, value: "300"}
